[workspace]
resolver = "3"
members = [
    "app/composition",
    "ping/generated/contract",
    "ping/implementation",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
boxology = { version = "=0.0.0", git = "https://github.com/fontanierh/boxology", rev = "e700b8358e3c5b42677406240fda8c3025d3d04f" }
boxology-contract = { version = "=0.0.0", git = "https://github.com/fontanierh/boxology", rev = "e700b8358e3c5b42677406240fda8c3025d3d04f" }
boxology-http = { version = "=0.0.0", git = "https://github.com/fontanierh/boxology", rev = "e700b8358e3c5b42677406240fda8c3025d3d04f" }
boxology-manifest = { version = "=0.0.0", git = "https://github.com/fontanierh/boxology", rev = "e700b8358e3c5b42677406240fda8c3025d3d04f" }
boxology-runtime = { version = "=0.0.0", git = "https://github.com/fontanierh/boxology", rev = "e700b8358e3c5b42677406240fda8c3025d3d04f" }
ping-contract = { version = "=0.0.0", path = "ping/generated/contract" }
tokio = { version = "=1.53.0", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }
