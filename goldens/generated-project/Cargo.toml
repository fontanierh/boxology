[workspace]
resolver = "3"
members = [
    "app/composition",
    "ping/generated/contract",
    "ping/implementation",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
boxology = { version = "=0.0.0", git = "https://github.com/fontanierh/boxology", rev = "6dae382948a0b41b61375163fc906c8002300131" }
boxology-contract = { version = "=0.0.0", git = "https://github.com/fontanierh/boxology", rev = "6dae382948a0b41b61375163fc906c8002300131" }
boxology-http = { version = "=0.0.0", git = "https://github.com/fontanierh/boxology", rev = "6dae382948a0b41b61375163fc906c8002300131" }
boxology-manifest = { version = "=0.0.0", git = "https://github.com/fontanierh/boxology", rev = "6dae382948a0b41b61375163fc906c8002300131" }
boxology-runtime = { version = "=0.0.0", git = "https://github.com/fontanierh/boxology", rev = "6dae382948a0b41b61375163fc906c8002300131" }
tokio = { version = "=1.53.0", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }
