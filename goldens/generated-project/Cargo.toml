[workspace]
resolver = "3"
members = [
    "app/composition",
    "ping/generated/contract",
    "ping/implementation",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
boxology = { version = "=0.0.0", path = "../boxology/crates/boxology" }
boxology-contract = { version = "=0.0.0", path = "../boxology/crates/boxology-contract" }
boxology-http = { version = "=0.0.0", path = "../boxology/crates/boxology-http" }
boxology-manifest = { version = "=0.0.0", path = "../boxology/crates/boxology-manifest" }
boxology-runtime = { version = "=0.0.0", path = "../boxology/crates/boxology-runtime" }
tokio = { version = "=1.53.0", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }
