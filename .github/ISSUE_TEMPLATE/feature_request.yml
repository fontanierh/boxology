name: Feature request
description: Propose a focused improvement to the Boxology framework
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What framework limitation or developer need should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful behavior and its public contract.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds or simpler approaches.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility impact
      description: Note effects on box contracts, generated output, manifests, or existing projects.
    validations:
      required: true
