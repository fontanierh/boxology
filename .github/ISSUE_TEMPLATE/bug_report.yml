name: Bug report
description: Report reproducible incorrect behavior in Boxology
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Boxology. Do not report security vulnerabilities here; use SECURITY.md.
  - type: input
    id: revision
    attributes:
      label: Boxology revision
      description: Commit SHA or branch where the problem occurs.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest complete steps or repository that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Rust version, and relevant commands.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs or contract details after removing credentials and private data.
