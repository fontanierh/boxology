name: pr

on:
  pull_request:

permissions:
  contents: read

env:
  # Keep the source-owned security-tool pin visible even though the expensive
  # deny suite is no longer part of every PR.
  CARGO_DENY_VERSION: "0.20.2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PR CI intentionally has one required native-Mac lane. The self-hosted runner
# already persists CARGO_HOME and CARGO_TARGET_DIR across jobs, so adding an
# actions/cache archive would only duplicate that cache and add transfer time.
# Full product, cross-platform, and release checks belong outside the merge
# critical path.
jobs:
  validation:
    runs-on: [self-hosted, macOS, ARM64, boxology-macos-pr-primary]
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
      RUST_TEST_THREADS: "4"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Record runner evidence
        run: |
          echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown} (${RUNNER_OS}/${RUNNER_ARCH})"
          rustc --version --verbose
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          test "$ImageOS" = macos-arm64-host
          test "$(rustc -vV | sed -n 's/^host: //p')" = "aarch64-apple-darwin"

      - name: CI hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cargo xtask ci-hygiene --base "$BASE_SHA"

      # Documentation-only PRs should not spend minutes recompiling Rust. For
      # code changes, the required lane tests only the directly changed crates;
      # the complete workspace suite belongs to dispatch-only deep validation.
      - name: Select test scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run_rust=true
          run_xtask=false
          run_workspace_check=false
          run_reaper=false
          run_fixtures=false
          run_delivery_worker=false
          changed_manifests="$RUNNER_TEMP/boxology-changed-manifests"
          : > "$changed_manifests"
          if test "$EVENT_NAME" = pull_request; then
            changed="$(git diff --name-only --no-renames "$BASE_SHA" HEAD)"
            if test -n "$changed" && ! grep -Evq '\.md$' <<<"$changed"; then
              run_rust=false
            fi
            if grep -Eq '^ops/process-reaper/' <<<"$changed"; then
              run_reaper=true
            fi
            if grep -Eq '^(crates/fixtures/|goldens/generated-project/)' <<<"$changed"; then
              run_fixtures=true
            fi
            if grep -Eq '^ops/delivery-worker/' <<<"$changed"; then
              run_delivery_worker=true
            fi
            if grep -Eq '^(crates/xtask/|\.github/workflows/|ops/ci-runner/|\.agents/skills/boxology/SKILL\.md$)' <<<"$changed"; then
              run_xtask=true
            fi
            if test "$run_rust" = true; then
              if grep -Eq '^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml)$' <<<"$changed"; then
                run_workspace_check=true
              fi
              while IFS= read -r changed_path; do
                case "$changed_path" in
                  crates/fixtures/fixture-tests/*) ;;
                  crates/fixtures/*|goldens/generated-project/*) continue ;;
                esac
                dir="$(dirname "$changed_path")"
                while test "$dir" != . && test "$dir" != /; do
                  if test -f "$dir/Cargo.toml"; then
                    printf '%s\n' "$dir/Cargo.toml" >> "$changed_manifests"
                    break
                  fi
                  dir="$(dirname "$dir")"
                done
              done <<<"$changed"
              sort -u -o "$changed_manifests" "$changed_manifests"
            fi
          fi
          echo "run_rust=$run_rust" | tee -a "$GITHUB_OUTPUT"
          echo "run_xtask=$run_xtask" | tee -a "$GITHUB_OUTPUT"
          echo "run_workspace_check=$run_workspace_check" | tee -a "$GITHUB_OUTPUT"
          echo "run_reaper=$run_reaper" | tee -a "$GITHUB_OUTPUT"
          echo "run_fixtures=$run_fixtures" | tee -a "$GITHUB_OUTPUT"
          echo "run_delivery_worker=$run_delivery_worker" | tee -a "$GITHUB_OUTPUT"

      # CI-authority changes exercise the repository unit suite. Ordinary
      # product changes retain live hygiene plus their directly changed crates;
      # deep validation owns the redundant xtask unit pass.
      - name: Test repository invariants
        if: steps.scope.outputs.run_xtask == 'true'
        run: cargo test -p xtask --locked

      - name: Test changed crates
        if: steps.scope.outputs.run_rust == 'true'
        run: |
          while IFS= read -r manifest; do
            case "$manifest" in
              crates/xtask/Cargo.toml)
                # Already covered by the repository-invariant step.
                ;;
              crates/boxology-init/Cargo.toml|\
              crates/boxology-cli/Cargo.toml|\
              crates/boxology-workspace/Cargo.toml|\
              crates/boxology-classifier/Cargo.toml|\
              crates/boxology-generator/Cargo.toml|\
              crates/boxology-generator-model/Cargo.toml)
                # Born-valid, five redundant integration targets, and two
                # nested-Cargo generator unit tests are deep-only.
                # Keep ordinary unit, binary, doctest, and integration coverage.
                if [ "$manifest" = crates/boxology-generator/Cargo.toml ]; then
                  cargo test --manifest-path "$manifest" --all-features --locked --lib --bins -- \
                    --exact \
                    --skip tests::generated_multi_capability_box_compiles_and_routes_both_capabilities \
                    --skip tests::structured_import_routes_through_provider_owned_alias_end_to_end
                else
                  cargo test --manifest-path "$manifest" --all-features --locked --lib --bins
                fi
                cargo test --manifest-path "$manifest" --all-features --locked --doc
                crate_dir="$(dirname "$manifest")"
                for source in "$crate_dir"/tests/*.rs; do
                  test -f "$source" || continue
                  target="$(basename "$source" .rs)"
                  case "$(basename "$crate_dir"):$target" in
                    boxology-init:born_valid|\
                    boxology-cli:cli|boxology-cli:surface_lock|\
                    boxology-workspace:surface_lock|\
                    boxology-classifier:surface_lock|\
                    boxology-generator-model:purity_lock)
                      continue
                      ;;
                  esac
                  cargo test --manifest-path "$manifest" --all-features --locked --test "$target"
                done
                ;;
              *)
                cargo test --manifest-path "$manifest" --all-features --locked
                ;;
            esac
          done < "$RUNNER_TEMP/boxology-changed-manifests"

      # Root dependency/toolchain changes can affect every member even when no
      # individual crate path changed. Compile the whole workspace only then.
      - name: Check workspace build graph
        if: steps.scope.outputs.run_workspace_check == 'true'
        run: cargo check --workspace --all-features --locked

      - name: Test changed opaque fixtures
        if: steps.scope.outputs.run_fixtures == 'true'
        run: cargo xtask ci-fixtures

      - name: Test process reaper
        if: steps.scope.outputs.run_reaper == 'true'
        run: bash ops/process-reaper/tests/run-tests.sh

      - name: Test delivery worker ownership
        if: steps.scope.outputs.run_delivery_worker == 'true'
        run: bash ops/delivery-worker/tests/run-tests.sh
