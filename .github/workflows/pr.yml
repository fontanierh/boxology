name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Keep the source-owned security-tool pin visible even though the expensive
  # deny suite is no longer part of every PR.
  CARGO_DENY_VERSION: "0.20.2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PR CI intentionally has one required native-Mac lane. The self-hosted runner
# already persists CARGO_HOME and CARGO_TARGET_DIR across jobs, so adding an
# actions/cache archive would only duplicate that cache and add transfer time.
# Deep cross-platform and release checks belong outside the merge critical path.
jobs:
  validation:
    runs-on: [self-hosted, macOS, ARM64, boxology-macos-pr]
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
      RUST_TEST_THREADS: "4"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Record runner evidence
        run: |
          echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown} (${RUNNER_OS}/${RUNNER_ARCH})"
          rustc --version --verbose
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          test "$ImageOS" = macos-arm64-host
          test "$(rustc -vV | sed -n 's/^host: //p')" = "aarch64-apple-darwin"

      # Documentation-only PRs should not spend minutes recompiling Rust. Main
      # pushes and every change outside the documentation/record surface run the
      # root-workspace suite below.
      - name: Select test scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run_rust=true
          run_generator=false
          if test "$EVENT_NAME" = pull_request; then
            changed="$(git diff --name-only "$BASE_SHA" HEAD)"
            if test -n "$changed" && ! grep -Evq '^(docs/|records/|specs/|ops/friction-log\.md$|[^/]+\.md$)' <<<"$changed"; then
              run_rust=false
            fi
            if grep -Eq '^crates/boxology-generator($|[-/])' <<<"$changed"; then
              run_generator=true
            fi
          fi
          echo "run_rust=$run_rust" | tee -a "$GITHUB_OUTPUT"
          echo "run_generator=$run_generator" | tee -a "$GITHUB_OUTPUT"

      - name: Test root workspace
        if: steps.scope.outputs.run_rust == 'true'
        run: cargo test --workspace --all-features --locked --exclude boxology-init --exclude boxology-generator

      # Keep fast init unit/CLI coverage, but leave its multi-minute born-valid
      # nested-workspace acceptance test out of the per-PR critical path.
      - name: Test init units
        if: steps.scope.outputs.run_rust == 'true'
        run: cargo test -p boxology-init --all-features --locked --lib --bins

      - name: Test generator when changed
        if: steps.scope.outputs.run_generator == 'true'
        run: cargo test -p boxology-generator --all-features --locked

      - name: Check Boxology model
        if: steps.scope.outputs.run_rust == 'true'
        run: cargo run -q -p boxology-cli --bin boxology -- check

      # ping-app is the smallest composition fixture outside the root workspace;
      # it keeps one real generated-contract/implementation composition in PR CI.
      - name: Test ping-app composition
        if: steps.scope.outputs.run_rust == 'true'
        run: |
          cargo fmt --check --manifest-path crates/fixtures/ping-app/Cargo.toml -p ping-app
          cargo test --manifest-path crates/fixtures/ping-app/Cargo.toml --all-features --locked

      - name: Test process reaper
        run: bash ops/process-reaper/tests/run-tests.sh
