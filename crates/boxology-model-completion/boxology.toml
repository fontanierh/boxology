schema = 1
id = "model-completion"
kind = "box"
owned = ["boxology.toml", "implementation/**"]
[quality]
commands = ["cargo check -p model-completion-contract --all-features", "cargo test -p model-completion-implementation"]
[[crates]]
cargo_package = "model-completion-implementation"
path = "implementation"
role = "box-implementation"
[[crates]]
cargo_package = "model-completion-contract"
path = "generated/contract"
role = "box-contract"
[[derived]]
id = "contract"
generator = "boxology-contract"
inputs = ["boxology.toml", "implementation/src/**"]
outputs = ["generated/contract/**", "generated/adapter/**", "generated/schema.json"]
