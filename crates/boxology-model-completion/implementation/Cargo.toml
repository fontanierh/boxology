[package]
name = "model-completion-implementation"
version = "0.0.0"
edition.workspace = true
publish = false
[dependencies]
boxology.workspace = true
boxology-contract.workspace = true
boxology-runtime.workspace = true
boxology_generated_contract = { package = "model-completion-contract", version = "=0.0.0", path = "../generated/contract" }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "native-tls", "json"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }
[dev-dependencies]
boxology_generated_contract = { package = "model-completion-contract", version = "=0.0.0", path = "../generated/contract", features = ["test-support"] }
