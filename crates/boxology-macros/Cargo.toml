[package]
name = "boxology-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Procedural macros"
publish = true

[lib]
proc-macro = true

[dependencies]
boxology-contract-syntax = { version = "=0.2.2", path = "../boxology-contract-syntax" }
proc-macro2 = { version = "=1.0.107", default-features = false }
quote = "=1.0.47"
syn = { version = "=3.0.4", default-features = false, features = ["full", "parsing", "printing", "visit"] }
