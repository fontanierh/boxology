[package]
name = "boxology-http"
version = "0.0.0"
edition.workspace = true
publish = false

[features]
default = ["server"]
server = [
    "dep:boxology-runtime",
    "dep:bytes",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:mediatype",
    "dep:tokio",
]
client = ["dep:boxology-runtime", "dep:http", "dep:reqwest", "dep:tokio"]

[dependencies]
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
boxology-contract = { version = "=0.0.0", path = "../boxology-contract" }
boxology-runtime = { version = "=0.0.0", path = "../boxology-runtime", optional = true }
bytes = { version = "=1.12.1", optional = true }
http = { version = "=1.4.2", optional = true }
http-body = { version = "=1.1.0", optional = true }
http-body-util = { version = "=0.1.4", optional = true }
mediatype = { version = "=0.21.0", optional = true }
reqwest = { version = "=0.13.4", default-features = false, optional = true }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }
tokio = { version = "=1.53.0", default-features = false, features = ["macros", "rt", "sync", "time"], optional = true }
ryu = "=1.0.23"

[dev-dependencies]
hello-contract = { version = "=0.0.0", path = "../fixtures/hello/generated/contract" }
tokio = { version = "=1.53.0", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
