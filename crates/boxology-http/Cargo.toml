[package]
name = "boxology-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "HTTP transport"
publish = false

[features]
default = ["server"]
server = [
    "dep:boxology-runtime",
    "dep:bytes",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:mediatype",
    "dep:tokio",
    "dep:tokio-util",
]
client = ["dep:boxology-runtime", "dep:http", "dep:reqwest", "dep:tokio"]

[dependencies]
boxology-contract = { version = "=0.1.1", path = "../boxology-contract" }
boxology-runtime = { version = "=0.1.1", path = "../boxology-runtime", optional = true }
bytes = { version = "=1.12.1", optional = true }
http = { version = "=1.5.0", optional = true }
http-body = { version = "=1.1.0", optional = true }
http-body-util = { version = "=0.1.4", optional = true }
hyper = { version = "=1.11.0", default-features = false, features = ["http1", "server"], optional = true }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"], optional = true }
mediatype = { version = "=0.21.0", optional = true }
reqwest = { version = "=0.13.4", default-features = false, optional = true }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }
tokio = { version = "=1.53.0", default-features = false, features = ["macros", "net", "rt", "sync", "time"], optional = true }
tokio-util = { version = "=0.7.18", default-features = false, optional = true }

[dev-dependencies]
boxology-runtime = { version = "=0.1.1", path = "../boxology-runtime", features = ["test-support"] }
tokio = { version = "=1.53.0", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
