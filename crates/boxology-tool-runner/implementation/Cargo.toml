[package]
name = "tool-runner-implementation"
version = "0.0.0"
edition.workspace = true
publish = false
[dependencies]
boxology.workspace = true
boxology-contract.workspace = true
boxology-runtime.workspace = true
boxology_generated_contract = { package = "tool-runner-contract", version = "=0.0.0", path = "../generated/contract" }
[dev-dependencies]
boxology_generated_contract = { package = "tool-runner-contract", version = "=0.0.0", path = "../generated/contract", features = ["test-support"] }
boxology-runtime = { workspace = true, features = ["test-support"] }
