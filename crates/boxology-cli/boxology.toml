schema = 1
id = "boxology-cli"
kind = "composition"
owned = ["boxology.toml", "Cargo.toml", "src/**", "tests/**"]

[quality]
commands = ["cargo test -p boxology-cli"]

[[crates]]
cargo_package = "boxology-cli"
path = "."
role = "composition"

[composition]
boxes = ["check", "classifier", "telegram"]
bindings = [
    { box = "check", capability = "check.check", transport = "in-process" },
    { box = "classifier", capability = "classifier.classify", transport = "in-process" },
    { box = "telegram", capability = "telegram.send_text", transport = "in-process" },
    { box = "telegram", capability = "telegram.send", transport = "in-process" },
    { box = "telegram", capability = "telegram.ask", transport = "in-process" },
    { box = "telegram", capability = "telegram.reply", transport = "in-process" },
    { box = "telegram", capability = "telegram.resolve_send", transport = "in-process" },
    { box = "telegram", capability = "telegram.pair_begin", transport = "in-process" },
    { box = "telegram", capability = "telegram.pair_complete", transport = "in-process" },
    { box = "telegram", capability = "telegram.pair_revoke", transport = "in-process" },
    { box = "telegram", capability = "telegram.poll", transport = "in-process" },
    { box = "telegram", capability = "telegram.listen_start", transport = "in-process" },
    { box = "telegram", capability = "telegram.ack", transport = "in-process" },
    { box = "telegram", capability = "telegram.status", transport = "in-process" },
]
