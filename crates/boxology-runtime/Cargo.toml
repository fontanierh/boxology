[package]
name = "boxology-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Runtime composition and invocation"
publish = true

[features]
test-support = []

[dependencies]
boxology-contract = { version = "=0.1.1", path = "../boxology-contract" }
tokio = { version = "=1.53.0", default-features = false, features = ["time"] }
tokio-util = { version = "0.7.18", default-features = false, features = ["rt"] }

[dev-dependencies]
tokio = { version = "=1.53.0", default-features = false, features = ["rt", "test-util"] }
