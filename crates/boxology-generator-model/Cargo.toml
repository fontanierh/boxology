[package]
name = "boxology-generator-model"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
boxology-contract = { version = "=0.0.0", path = "../boxology-contract" }
boxology-contract-syntax = { version = "=0.0.0", path = "../boxology-contract-syntax" }
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
serde_json = "=1.0.150"
syn = { version = "=3.0.0", default-features = false, features = ["full", "parsing", "visit"] }
toml_edit = "=0.25.13+spec-1.1.0"
