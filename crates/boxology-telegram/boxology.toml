schema = 1
id = "telegram"
kind = "box"
owned = ["boxology.toml", "implementation/**", "protocol/**"]

[quality]
commands = [
    "cargo check -p telegram-contract --all-features",
    "cargo test -p boxology-telegram",
]

[[crates]]
cargo_package = "boxology-telegram"
path = "implementation"
role = "box-implementation"

[[crates]]
cargo_package = "telegram-contract"
path = "generated/contract"
role = "box-contract"

[[derived]]
id = "contract"
generator = "boxology-contract"
inputs = ["boxology.toml", "implementation/src/**"]
outputs = ["generated/contract/**", "generated/adapter/**", "generated/schema.json"]
