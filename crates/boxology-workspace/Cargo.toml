[package]
name = "boxology-workspace"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
boxology-contract = { version = "=0.0.0", path = "../boxology-contract" }
boxology-manifest = { version = "=0.0.0", path = "../boxology-manifest" }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }

[[test]]
name = "surface_lock"
path = "tests/surface_lock.rs"
[dev-dependencies]
syn = { version = "=3.0.0", default-features = false, features = ["full", "parsing", "visit"] }
