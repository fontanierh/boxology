[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
boxology-classifier = { version = "=0.0.0", path = "../boxology-classifier" }
boxology-contract = { version = "=0.0.0", path = "../boxology-contract" }
boxology-generator = { version = "=0.0.0", path = "../boxology-generator" }
boxology-generator-model = { version = "=0.0.0", path = "../boxology-generator-model" }
boxology-init = { version = "=0.0.0", path = "../boxology-init" }
boxology-manifest = { version = "=0.0.0", path = "../boxology-manifest" }
boxology-schema = { version = "=0.0.0", path = "../boxology-schema" }
boxology-workspace = { version = "=0.0.0", path = "../boxology-workspace" }
sha2 = "=0.10.9"
serde_json = "=1.0.150"
syn = { version = "=3.0.0", default-features = false, features = ["full", "parsing", "visit"] }
toml_edit = "=0.25.13+spec-1.1.0"
