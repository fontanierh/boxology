[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
boxology-classifier = { version = "=0.2.0", path = "../boxology-classifier" }
boxology-cli-core = { version = "=0.2.0", path = "../boxology-cli-core" }
boxology-contract = { version = "=0.2.0", path = "../boxology-contract" }
boxology-generator = { version = "=0.2.0", path = "../boxology-generator" }
boxology-generator-model = { version = "=0.2.0", path = "../boxology-generator-model" }
boxology-init = { version = "=0.2.0", path = "../boxology-init" }
boxology-manifest = { version = "=0.2.0", path = "../boxology-manifest" }
boxology-schema = { version = "=0.2.0", path = "../boxology-schema" }
boxology-workspace = { version = "=0.2.0", path = "../boxology-workspace" }
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
sha2 = "=0.10.9"
serde_json = "=1.0.150"
serde_yaml = "=0.9.34"
syn = { version = "=3.0.0", default-features = false, features = ["full", "parsing", "printing", "visit"] }
toml_edit = "=0.25.13"
