schema = 1
id = "agent-harness"
kind = "composition"
owned = ["boxology.toml", "Cargo.toml", "src/**", "tests/**"]

[quality]
commands = ["cargo test -p agent-harness"]

[[crates]]
cargo_package = "agent-harness"
path = "."
role = "composition"

[composition]
boxes = ["model-completion", "tool-runner", "session-store", "agent-loop"]
bindings = [
  { box = "agent-loop", capability = "agent-loop.run_turn", transport = "in-process" },
  { box = "agent-loop", capability = "agent-loop.compact", transport = "in-process" },
]
