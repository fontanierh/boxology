schema = 1
id = "session-store"
kind = "box"
owned = ["boxology.toml", "implementation/**"]
[quality]
commands = ["cargo check -p session-store-contract --all-features", "cargo test -p session-store-implementation"]
[[crates]]
cargo_package = "session-store-implementation"
path = "implementation"
role = "box-implementation"
[[crates]]
cargo_package = "session-store-contract"
path = "generated/contract"
role = "box-contract"
[[derived]]
id = "contract"
generator = "boxology-contract"
inputs = ["boxology.toml", "implementation/src/**"]
outputs = ["generated/contract/**", "generated/adapter/**", "generated/schema.json"]
