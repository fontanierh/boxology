[package]
name = "session-store-implementation"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
boxology.workspace = true
boxology-contract.workspace = true
boxology-runtime.workspace = true
boxology_generated_contract = { package = "session-store-contract", version = "=0.0.0", path = "../generated/contract" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }
[dev-dependencies]
boxology_generated_contract = { package = "session-store-contract", version = "=0.0.0", path = "../generated/contract", features = ["test-support"] }
boxology-runtime = { workspace = true, features = ["test-support"] }
