schema = 1
id = "greeter"
kind = "box"
owned = ["boxology.toml", "implementation/**"]

[[imports]]
package = "hello"
contract = "hello"

[quality]
commands = [
    "cargo check -p greeter-contract --all-features",
    "cargo test -p greeter-implementation",
]

[[crates]]
cargo_package = "greeter-implementation"
path = "implementation"
role = "box-implementation"

[[crates]]
cargo_package = "greeter-contract"
path = "generated/contract"
role = "box-contract"

[[derived]]
id = "contract"
generator = "boxology-contract"
inputs = ["boxology.toml", "implementation/src/**"]
outputs = ["generated/contract/**", "generated/adapter/**", "generated/schema.json"]
