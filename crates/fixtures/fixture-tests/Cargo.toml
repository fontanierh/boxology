[package]
name = "boxology-fixture-tests"
version = "0.0.0"
edition.workspace = true
publish = false

[dev-dependencies]
boxology-contract = { version = "=0.2.2", path = "../../boxology-contract" }
boxology-http = { version = "=0.2.2", path = "../../boxology-http", features = ["client"] }
boxology-generator = { version = "=0.2.2", path = "../../boxology-generator" }
boxology-generator-model = { version = "=0.2.2", path = "../../boxology-generator-model" }
boxology-runtime = { version = "=0.2.2", path = "../../boxology-runtime", features = ["test-support"] }
greeter-contract = { version = "=0.0.0", path = "../greeter/generated/contract" }
greeter-implementation = { version = "=0.0.0", path = "../greeter/implementation" }
hello-contract = { version = "=0.0.0", path = "../hello/generated/contract", features = ["test-support"] }
hello-implementation = { version = "=0.0.0", path = "../hello/implementation" }
serde_json = "=1.0.150"
tokio = { version = "=1.53.0", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }
