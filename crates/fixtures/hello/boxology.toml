schema = 1
id = "hello"
kind = "box"
owned = ["boxology.toml", "authoring/**", "implementation/**"]

[quality]
commands = [
    "cargo check -p hello-contract --all-features",
    "cargo test -p boxology-fixture-tests",
]

[[crates]]
cargo_package = "hello-contract"
path = "generated/contract"
role = "box-contract"

[[derived]]
id = "contract"
generator = "boxology-contract"
inputs = ["boxology.toml", "authoring/**"]
outputs = ["generated/contract/**", "generated/adapter/**", "generated/schema.json"]
