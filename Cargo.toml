[workspace]
resolver = "3"
exclude = [
    "crates/fixtures/generated-style-fmt",
    "crates/fixtures/greeter",
    "crates/fixtures/hello",
    "crates/fixtures/ping",
    "crates/fixtures/ping-app",
]
members = [
    "crates/boxology-contract",
    "crates/boxology-contract-syntax",
    "crates/boxology",
    "crates/boxology-macros",
    "crates/boxology-generator",
    "crates/boxology-generator-model",
    "crates/boxology-generator-writer",
    "crates/boxology-manifest",
    "crates/boxology-init",
    "crates/boxology-schema",
    "crates/boxology-classifier",
    "crates/boxology-classifier/implementation",
    "crates/boxology-classifier/generated/contract",
    "crates/boxology-check/generated/contract",
    "crates/boxology-check/implementation",
    "crates/boxology-workspace",
    "crates/boxology-cli",
    "crates/boxology-cli-core",
    "crates/boxology-http",
    "crates/boxology-http-conformance",
    "crates/boxology-runtime",
    "crates/fixtures/fixture-tests",
    "crates/xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fontanierh/boxology"
homepage = "https://github.com/fontanierh/boxology"
readme = "README.md"

[workspace.dependencies]
boxology = { version = "=0.2.0", path = "crates/boxology" }
boxology-contract = { version = "=0.2.0", path = "crates/boxology-contract" }
boxology-runtime = { version = "=0.2.0", path = "crates/boxology-runtime" }
