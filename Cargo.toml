[workspace]
resolver = "3"
exclude = [
    "crates/fixtures/generated-style-fmt",
    "crates/fixtures/greeter",
    "crates/fixtures/hello",
    "crates/fixtures/ping",
    "crates/fixtures/ping-app",
]
members = [
    "crates/boxology-contract",
    "crates/boxology-contract-syntax",
    "crates/boxology",
    "crates/boxology-macros",
    "crates/boxology-generator",
    "crates/boxology-generator-model",
    "crates/boxology-generator-writer",
    "crates/boxology-manifest",
    "crates/boxology-init",
    "crates/boxology-schema",
    "crates/boxology-classifier",
    "crates/boxology-workspace",
    "crates/boxology-cli",
    "crates/boxology-http",
    "crates/boxology-http-conformance",
    "crates/boxology-runtime",
    "crates/boxology-telegram/implementation",
    "crates/boxology-telegram/generated/contract",
    "crates/fixtures/fixture-tests",
    "crates/xtask",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
boxology = { version = "=0.0.0", path = "crates/boxology" }
boxology-contract = { version = "=0.0.0", path = "crates/boxology-contract" }
boxology-runtime = { version = "=0.0.0", path = "crates/boxology-runtime" }
