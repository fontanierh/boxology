<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
  <title id="title">Generator upgrade ownership authority</title>
  <desc id="desc">Only a validated generator configuration upgrade and exact regeneration evidence authorize cross-package derived outputs; tampered outputs fail.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="270" rx="18" fill="#f8fafc"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <rect x="30" y="70" width="220" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="140" y="105" font-size="17" font-weight="700" fill="#0c4a6e">Root generator config</text>
    <text x="140" y="133" font-size="14" fill="#075985">semantic version/source change</text>
    <text x="140" y="157" font-size="14" fill="#075985">candidate = running checker</text>

    <rect x="370" y="70" width="220" height="110" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="480" y="105" font-size="17" font-weight="700" fill="#4c1d95">Regenerate each plan</text>
    <text x="480" y="133" font-size="14" fill="#5b21b6">exact package/output pair</text>
    <text x="480" y="157" font-size="14" fill="#5b21b6">byte-for-byte comparison</text>

    <rect x="710" y="32" width="220" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="820" y="68" font-size="17" font-weight="700" fill="#14532d">Verified output</text>
    <text x="820" y="96" font-size="14" fill="#166534">cross-package change allowed</text>

    <rect x="710" y="154" width="220" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="820" y="190" font-size="17" font-weight="700" fill="#7f1d1d">Missing / tampered</text>
    <text x="820" y="218" font-size="14" fill="#991b1b">BXW0083 + BXW0101</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M250 125 H360"/>
    <path d="M590 110 C645 110 655 77 700 77"/>
    <path d="M590 140 C645 140 655 199 700 199"/>
  </g>
</svg>
