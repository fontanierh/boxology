<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" role="img" aria-labelledby="title desc">
  <title id="title">Imported-contract regeneration authority</title>
  <desc id="desc">An owned contract change authorizes exact downstream importer regeneration only when both generation plans are verified; stale or tampered outputs fail.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <rect width="1040" height="300" rx="18" fill="#f8fafc"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
    <rect x="25" y="75" width="220" height="120" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="135" y="112" font-size="17" font-weight="700" fill="#0c4a6e">Owned contract change</text><text x="135" y="142" font-size="14" fill="#075985">generated schema in Git diff</text><text x="135" y="168" font-size="14" fill="#075985">non-derived package owner</text>
    <rect x="315" y="75" width="240" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="435" y="112" font-size="17" font-weight="700" fill="#4c1d95">Verify both plans</text><text x="435" y="142" font-size="14" fill="#5b21b6">imported + importer trees</text><text x="435" y="168" font-size="14" fill="#5b21b6">byte-for-byte exact</text>
    <rect x="625" y="38" width="380" height="95" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="815" y="77" font-size="17" font-weight="700" fill="#14532d">Exact importer output</text><text x="815" y="105" font-size="14" fill="#166534">downstream regeneration is owned</text>
    <rect x="625" y="168" width="380" height="95" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="815" y="207" font-size="17" font-weight="700" fill="#7f1d1d">Missing / stale / tampered evidence</text><text x="815" y="235" font-size="14" fill="#991b1b">BXW0083 + BXW0101</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"><path d="M245 135 H305"/><path d="M555 112 C590 112 590 86 615 86"/><path d="M555 158 C590 158 590 215 615 215"/></g>
</svg>
