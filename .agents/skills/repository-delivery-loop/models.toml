schema = 1

# Only `spec` configures fallback. `implement`, `repair`, and `review` declare a
# single candidate with no `fallback_on`, so an unavailable or exhausted model
# stops the phase and is reported rather than silently substituting one the
# operator did not choose.

[roles.spec]
fallback_on = ["model_unavailable", "usage_exhausted"]

[[roles.spec.candidates]]
harness = "kimi"
model = "kimi-code/k3"
effort = "high"

# Reached only when Kimi reports the model unavailable or its usage exhausted.
# A rejected specification, a NO-GO verdict, or a timeout is not a fallback
# condition and must stop the phase instead.
[[roles.spec.candidates]]
harness = "claude"
model = "claude-fable-5"
effort = "high"

[roles.implement]

[[roles.implement.candidates]]
harness = "cursor"
model = "cursor-grok-4.5-high-fast"
effort = "high"

[roles.review]

[[roles.review.candidates]]
harness = "claude"
model = "claude-opus-5"
effort = "high"

[roles.repair]
use = "implement"
