schema = 1

# Sol owns every delivery role. `spec` is the planning role; `repair` inherits
# the implementation role so review feedback returns to Sol at medium effort.

[roles.spec]
[[roles.spec.candidates]]
harness = "codex"
model = "gpt-5.6-sol"
effort = "xhigh"

[roles.implement]
[[roles.implement.candidates]]
harness = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[roles.review]
[[roles.review.candidates]]
harness = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[roles.advisor]
[[roles.advisor.candidates]]
harness = "codex"
model = "gpt-5.6-sol"
effort = "xhigh"

[roles.repair]
use = "implement"
