schema = 1

# One candidate per role. No `fallback_on` is configured anywhere, so an
# unavailable or exhausted candidate stops the phase and is reported rather
# than silently substituting a different model.

[roles.spec]

[[roles.spec.candidates]]
harness = "kimi"
model = "kimi-code/k3"
effort = "high"

[roles.implement]

[[roles.implement.candidates]]
harness = "cursor"
model = "cursor-grok-4.5-high"
effort = "high"

[roles.review]

[[roles.review.candidates]]
harness = "claude"
model = "claude-opus-5"
effort = "high"

[roles.repair]
use = "implement"
