schema = 1

# `implement` configures fallback; `repair` inherits `implement`.
# `spec` and `review` each declare one candidate with no `fallback_on`, so an
# unavailable or exhausted worker stops the phase and is reported rather than
# silently substituting one the operator did not choose.

[roles.spec]
[[roles.spec.candidates]]
harness = "claude"
model = "claude-fable-5"
effort = "medium"

[roles.implement]
fallback_on = ["model_unavailable", "usage_exhausted"]

[[roles.implement.candidates]]
harness = "cursor"
model = "cursor-grok-4.5-high-fast"
effort = "high"

# Reached only when Cursor reports the model unavailable or its usage
# exhausted. A transport failure such as an HTTP 503 is not a fallback
# condition: retry the first candidate instead.
[[roles.implement.candidates]]
harness = "codex"
model = "gpt-5.6-luna"
effort = "max"

[roles.review]

[[roles.review.candidates]]
harness = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[roles.repair]
use = "implement"
